
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | My Personal Website</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    
    <header>

        <div class="logo">MY<span>WEBSITE.</span></div>

        <nav>
            <a href="index.html">Home</a>
            <a href="journey.html">My Journey</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

   
    <section>

        <h1 class="section-title">Get to Know Me</h1>

        <p>
            I am passionate about learning, creativity and
            technology. I enjoy connecting with people,
            exchanging ideas and discovering opportunities
            to grow.
        </p>

    </section>

   
    <section>

        <h2 class="section-title">Send Me a Message</h2>

        <form class="contact-form" action="#" method="post">

            <label for="fullname">Full Name</label>

            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="subject">Subject</label>

            <select id="subject" name="subject">

                <option value="">Select a subject</option>
                <option value="general">General Enquiry</option>
                <option value="academic">Academic Discussion</option>
                <option value="collaboration">Collaboration</option>
                <option value="other">Other</option>

            </select>

            <label for="message">Your Message</label>

            <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Write your message here"
                required
            ></textarea>

            <button type="submit">Send Message</button>

        </form>

    </section>


   
    <footer>

        <p>&copy; 2026 My Personal Website. All Rights Reserved.</p>

    </footer>

</body>
</html>
